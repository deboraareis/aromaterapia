<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{% block description %}{{ site.descricao }}{% endblock %}">
  <meta name="theme-color" content="{{ site.cor_tema }}">
  <link rel="canonical" href="{{ site.url }}{{ base }}{{ canonical|default('/') }}">

  <title>{% block titulo %}{{ site.titulo }}{% endblock %}</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236b7f5e'/%3E%3Ctext x='50' y='68' font-size='56' font-family='Georgia,serif' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ base }}/static/css/tokens.css">
  <link rel="stylesheet" href="{{ base }}/static/css/estilos.css">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_titulo %}{{ site.titulo }}{% endblock %}">
  <meta property="og:description" content="{% block og_descricao %}{{ site.descricao }}{% endblock %}">
  <meta property="og:image" content="{{ site.url }}{{ base }}/static/img/debora-avatar.jpg">
  <meta property="og:locale" content="pt_BR">

  {% block schema %}{% endblock %}

  <script defer src="{{ base }}/static/js/app.js"></script>
  <script defer src="{{ base }}/static/js/menu.js"></script>
  <script defer src="{{ base }}/static/js/faq.js"></script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  {% include "partials/header.html" %}

  <main id="conteudo">
    {% block conteudo %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}
  {% include "partials/whatsapp-float.html" %}
</body>
</html>
